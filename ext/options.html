<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>tagmarks options</title><link rel="stylesheet" href="sidebar.css">
<style>body{max-width:640px;margin:1em auto;padding:0 1em}label.sw{display:block;margin:.4em 0}textarea{width:100%;box-sizing:border-box}h3{margin:1em 0 .2em}small{opacity:.7}</style></head>
<body>
<h2>modules</h2>
<label class="sw"><input type="checkbox" id="cookieAutoDelete"> cookie autodelete <small>- when a tab closes, delete cookies of sites no tab shows any more</small></label>
<h3>keep cookies of <small>(one host per line)</small></h3><textarea id="keepCookies" rows="3"></textarea>
<label class="sw"><input type="checkbox" id="darkMode"> dark pages <small>- inverts page colours, images and video stay</small></label>
<h3>dark mode skips <small>(one host per line)</small></h3><textarea id="darkExclude" rows="3"></textarea>
<label class="sw"><input type="checkbox" id="trackerBlock"> block third-party trackers <small>- a short built-in list; uBlock Origin does the rest</small></label>
<h3>extra tracker domains <small>(one per line)</small></h3><textarea id="trackers" rows="3"></textarea>
<label class="sw"><input type="checkbox" id="autoDiscard"> unload idle tabs after <input type="number" id="discardMinutes" min="1" max="1440" style="width:5em"> minutes <small>- not the active, pinned or playing ones</small></label>
<p><button id="save">save</button> <span id="status"></span></p>
<details><summary>config as JSON</summary><textarea id="json" rows="12"></textarea><button id="load">load this JSON</button></details>
<script type="module" src="options.js"></script>
</body></html>
