<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>tagmarks</title><link rel="stylesheet" href="sidebar.css"></head>
<body>
<input id="q" type="search" placeholder="#tag  -#x  url:..  &quot;phrase&quot;  A OR B" autofocus>
<div id="chips"></div>
<div id="saved" class="chips"></div>
<div id="saverow"><input id="savename" placeholder="save this query as (work/reading)"> <button id="savebtn">save</button></div>
<div id="bar"><span id="status"></span><button id="openres">open results</button></div>
<div id="tree"></div>
<details id="iobox"><summary>import / export tags</summary>
<textarea id="io" rows="5" placeholder="url&lt;TAB&gt;tag,tag per line"></textarea>
<button id="exp">export</button> <button id="imp">import</button></details>
<script type="module" src="sidebar.js"></script>
</body></html>
